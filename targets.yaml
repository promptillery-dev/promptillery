# Deployment-target grid for tab:recommender (§8) + the regret figure (§9).
#
# RESEARCHER DEGREES OF FREEDOM. The accuracy floors, the volume-threshold
# baseline's threshold, and the price table (prices.yaml) all decide where the
# recommender wins, so none of them is hand-picked: each is derived by a stated
# rule from validation accuracies and logged costs (scripts/derive_targets.py,
# docs/TARGETS_DERIVATION.md). Picking floors where the recommender happens to
# win, or tuning the threshold to make the baseline look bad, would be test-set
# tuning. These are the final values behind the paper's recommender evaluation.

# Teacher-API fallback: dollars per call if no student is deployed.
teacher:
  usd_per_call: 0.0011   # 1,624,664 in + 15,315 out tokens over 3,080 Banking77 test calls at $2/$8 per 1M

# The profiled GPU. Every joined profile's hardware stamp is asserted against
# this so wrong-GPU latency can never reach the table (#22).
expect_gpu_name: "NVIDIA GeForce RTX 4090"

# Crossed into the target grid (floors x latency budgets x volumes).
accuracy_floors: [0.89, 0.91, 0.92]   # quartiles of the six cells' selection accuracies (scripts/derive_targets.py)
latency_budgets_ms: [null, 50, 10]         # null = no latency constraint
volumes: [1000, 10000, 100000, 1000000, 10000000, 100000000]

# Volume-threshold baseline: below this volume it calls the teacher, above it it
# deploys the cheapest-to-serve cell. Derive from a stated rule, never hand-tuned.
volume_threshold: 262     # median break-even volume across cells (scripts/derive_targets.py)
random_seed: 0

# The single target whose full cost receipt is written to recommendation.json.
primary_target:
  accuracy_floor: 0.91
  latency_budget_ms: null
  volume: 1000000
