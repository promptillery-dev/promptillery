name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra paper --python ${{ matrix.python-version }}

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -q

      - name: Demo replay (frozen Banking77 artifacts, no GPU)
        run: |
          uv run promptillery recommend \
            --main-results examples/demo/banking77/paper_main_results.csv \
            --profile-dir examples/demo/banking77/profiles \
            --prices prices.yaml --targets targets.yaml -o out/demo_report
          uv run promptillery paper-figures out/demo_report --format pdf
          test -f out/demo_report/recommendation.json
