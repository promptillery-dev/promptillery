# =============================================================================
# G2 — Banking77 cross-architecture hub: FastText (lightweight reference)
# =============================================================================
# The lower bound of the cost/quality frontier (issue #3): a CPU-friendly
# linear classifier that anchors how far the transformer/decoder students pull
# ahead. Same protocol otherwise: teacher GPT-4.1 via OpenRouter, one monotonic
# 10-cycle run, single seed, Banking77.
#
# FIDELITY: like the encoders, FastText predicts an integer class id per row, so
# it reports student-vs-teacher fidelity through the same seam (issue #3 story
# 28 — the reference rows of tab:deployment get a fidelity cell too). Point it at
# the shared teacher test-label file (materialize once from
# examples/G2_banking77_materialize.yaml, --mode teacher --split test).
#
# NOT CI-verified; run on the remote box (CPU is fine for FastText).
# =============================================================================

name: "g2_banking77_fasttext"

teacher: "openrouter/openai/gpt-4.1"

student: "fasttext"
student_type: "fasttext"

dataset: "PolyAI/banking77"
# PolyAI/banking77 ships a loader script; recent `datasets` refuses to run it
# without trust_remote_code, so a fresh `train`/`materialize-sft` fails to load
# the data unless we opt in here.
dataset_kwargs:
  trust_remote_code: true
dataset_config:
  name: "default"
  num_classes: 77
  text_field: "text"
  label_field: "label"

metrics:
  - accuracy
  - f1

cycles: 10
seed: 13

# FastText hyperparameters (higher LR + more epochs than transformers).
learning_rate: 0.25
num_train_epochs: 15
augmentation_batch_size: 32

# Carve validation from train (Banking77 has only train+test) so cycle
# selection never touches the held-out test set (major #4).
require_validation_split: true

# Active-learning-loop teacher output cap: must fit augmentation_batch_size
# record generation, not just one label. Materialization no longer reads this
# (that moved to examples/G2_banking77_materialize.yaml, at 16 tokens), but the AL
# loop still needs it: with token_budget set, an UNSET cap makes the
# augmentation preflight mask every teacher call (engine.py:959-961), silently
# disabling online augmentation.
teacher_max_output_tokens: 4096

token_budget: 20000000
budget_stop: true
base_output_dir: "out/g2"

early_stopping:
  enabled: false

trainer_config:
  # Select on validation, report finals on a clean held-out test pass (major #4).
  report_held_out_test: true

  # Student-vs-teacher fidelity on the held-out test split. Points at the shared
  # teacher test-label file materialized from examples/G2_banking77_materialize.yaml.
  fidelity:
    teacher_labels_path: "out/g2/banking77_teacher_test.jsonl"
    split: "test"

prompt: |
  You are a teacher model in a knowledge-distillation pipeline for the Banking77
  intent-classification task (77 fine-grained customer-banking intents).

  # Reference Examples
  {{ format_samples_for_prompt(few_shot_samples, include_prediction=False) }}

  # Student Model Performance
  ```
  {{ classification_report }}
  ```

  # Student Model Errors

  ## High Uncertainty Samples
  {{ format_samples_for_prompt(high_entropy_samples, include_prediction=True) }}

  ## Confident Misclassifications
  {{ format_samples_for_prompt(hard_negative_samples, include_prediction=True) }}

  # Task
  Generate {{ augmentation_batch_size }} new customer-message / intent-label
  samples that target the student's weakest and most-confused intents. Each
  sample must use a valid Banking77 intent as its gold label and cover diverse
  phrasings within each targeted intent.
