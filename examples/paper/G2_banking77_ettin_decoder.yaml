# =============================================================================
# G2 — Banking77 cross-architecture hub: Ettin decoder (decoder SLM student)
# =============================================================================
# The decoder half of Ettin's matched encoder/decoder pair (issue #3). Same
# scale/recipe/data as G2_banking77_ettin_encoder.yaml, so encoder-vs-decoder
# isolates architecture. Classification-via-generation: the SLM scores each
# canonical Banking77 label.
#
# NOT CI-verified: needs a GPU, HF hub access, and a real teacher key. The
# offline CI proxy for this code path is examples/causal_lm_sft_tiny.yaml.
# Run on the remote 2xA100 box.
#
# -----------------------------------------------------------------------------
# HOW TO RUN
# -----------------------------------------------------------------------------
# 0) export OPENROUTER_API_KEY=sk-or-...
#
# 1) Materialize all SFT artifacts from the shared companion config
#    examples/G2_banking77_materialize.yaml (this config cannot drive
#    materialize-sft: its `dataset: json` points at the JSONL files the step
#    creates, and its cycle-level `prompt` references AL-only variables). The
#    companion writes the decoder GOLD-labeled train/validation SFT files
#    (--mode gold: free, and supervision-matched to the encoders so the matched
#    pair isolates architecture), the shared teacher TEST-label file
#    (student-independent; also this config's `test` data_files entry), and
#    out/g2/canonical_labels.json. See that config's header for full notes:
#
#      uv run promptillery materialize-sft examples/G2_banking77_materialize.yaml \
#        --mode gold --split train \
#        --output out/g2/banking77_sft_train.jsonl --overwrite
#      uv run promptillery materialize-sft examples/G2_banking77_materialize.yaml \
#        --mode gold --split validation \
#        --output out/g2/banking77_sft_validation.jsonl --overwrite
#      uv run promptillery materialize-sft examples/G2_banking77_materialize.yaml \
#        --mode teacher --split test --token-budget 5000000 \
#        --output out/g2/banking77_teacher_test.jsonl --overwrite
#
# 2) uv run promptillery train examples/G2_banking77_ettin_decoder.yaml
# 3) uv run promptillery analyze out/g2 --metric macro_f1
# =============================================================================

name: "g2_banking77_ettin_decoder"

teacher: "openrouter/openai/gpt-4.1"

student: "jhu-clsp/ettin-decoder-150m"
student_type: "slm"

dataset: "json"
dataset_kwargs:
  data_files:
    train: "out/g2/banking77_sft_train.jsonl"
    validation: "out/g2/banking77_sft_validation.jsonl"
    # The held-out test split: the shared teacher test-label file. It carries
    # student_prompt + gold_answer (the student generates on it) AND the teacher
    # label per row (fidelity), so it is both this split's data and the fidelity
    # reference below. Without a test split, decoder fidelity/held-out never fire
    # (blocker #2).
    test: "out/g2/banking77_teacher_test.jsonl"
dataset_config:
  # This is the HF builder config name passed to load_dataset("json", name, ...).
  # It must be a valid builder name: the source slug "PolyAI/banking77" contains
  # a "/", which HF rejects (InvalidConfigName) before a row is read. Use the
  # json builder's "default" config, like every other dataset: json example.
  name: "default"
  num_classes: 77
  # The AL loop builds the teacher augmentation context from the TRAIN split
  # every cycle (engine._prepare_sample_context reads these two fields). The
  # decoder's train split is the materialized SFT JSONL, whose columns are
  # student_prompt / gold_answer / teacher_response -- there is no text/label.
  # Pointing these at the encoder's text/label raises KeyError('label') the
  # moment cycle 1's augmentation prompt is prepared.
  text_field: "student_prompt"
  label_field: "gold_answer"

metrics:
  - eval_loss
  - perplexity
  - exact_match
  - macro_f1

cycles: 10
seed: 13

learning_rate: 2e-4
num_train_epochs: 3
batch_size: 16
warmup_steps: 10
weight_decay: 0.0
augmentation_batch_size: 32

# Active-learning-loop teacher output cap: must fit augmentation_batch_size
# record generation, not just one label. Materialization no longer reads this
# (that moved to examples/G2_banking77_materialize.yaml, at 16 tokens), but the AL
# loop still needs it: with token_budget set, an UNSET cap makes the
# augmentation preflight mask every teacher call (engine.py:959-961), silently
# disabling online augmentation.
teacher_max_output_tokens: 4096

token_budget: 20000000
budget_stop: true
require_validation_split: true
base_output_dir: "out/g2"

early_stopping:
  enabled: false

trainer_config:
  max_seq_length: 256

  # Enable remote code in case a checkpoint declares custom modeling code.
  trust_remote_code: true

  # Cycle selection uses the validation split; report final metrics (incl.
  # fidelity) on the held-out test split (blocker #2 / major #4). The fidelity
  # split is scored in full despite max_eval_generation_samples, so its
  # denominator matches the encoders (blocker #3).
  report_held_out_test: true

  use_lora: true
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lora_target_modules: "all-linear"

  prompt_field: "student_prompt"
  response_field: "teacher_response"
  gold_answer_field: "gold_answer"

  answer_extraction: "canonical_label"
  canonical_label_decoding: "score"
  canonical_labels_path: "out/g2/canonical_labels.json"
  task_metric: "macro_f1"

  completion_only_loss: true

  generation_max_new_tokens: 16
  generation_batch_size: 16
  max_eval_generation_samples: 500

  budget_splits: ["train"]
  require_teacher_token_fields: true

  # Student-vs-teacher fidelity on the held-out test split (shared file).
  fidelity:
    teacher_labels_path: "out/g2/banking77_teacher_test.jsonl"
    split: "test"

prompt: |
  You are a teacher model in a knowledge-distillation pipeline for the Banking77
  intent-classification task (77 fine-grained customer-banking intents).

  # Reference Examples
  {{ format_samples_for_prompt(few_shot_samples, include_prediction=False) }}

  # Student Model Performance
  ```
  {{ classification_report }}
  ```

  # Student Model Errors

  ## High Uncertainty Samples
  {{ format_samples_for_prompt(high_entropy_samples, include_prediction=True) }}

  ## Confident Misclassifications
  {{ format_samples_for_prompt(hard_negative_samples, include_prediction=True) }}

  # Task
  Generate {{ augmentation_batch_size }} new customer-message / intent-label SFT
  records that target the student's weakest and most-confused intents. Each
  record must use a valid Banking77 intent as its gold answer and cover diverse
  phrasings within each targeted intent.
