# =============================================================================
# G2 — Banking77 cross-architecture hub: ModernBERT-base (encoder student)
# =============================================================================
# One student in the cross-architecture comparison. Every student
# runs the SAME protocol: teacher GPT-4.1 via OpenRouter, a single monotonic
# active-learning run to 10 cycles (the paper reads cost/accuracy/fidelity off
# cycles {1, 5, 10}), single seed, Banking77 (77 intents).
#
# NOT CI-verified: needs a GPU, network access to the HF hub, and a real
# teacher key. Run on the remote 2xA100 box.
#
# -----------------------------------------------------------------------------
# HOW TO RUN
# -----------------------------------------------------------------------------
# 0) Set the teacher key once (litellm routes "openrouter/..." automatically):
#      export OPENROUTER_API_KEY=sk-or-...
#
# 1) Materialize the shared teacher TEST-label file ONCE from the companion
#    config examples/paper/G2_banking77_materialize.yaml (this config no longer carries
#    materialization settings live there). The
#    file is student-independent and shared by every encoder/decoder student to
#    score fidelity (student-vs-teacher top-1 agreement on the held-out test).
#    --token-budget covers the full ~3,080-row test split in one pass:
#
#      uv run promptillery materialize-sft examples/paper/G2_banking77_materialize.yaml \
#        --mode teacher --split test --token-budget 5000000 \
#        --output out/g2/banking77_teacher_test.jsonl --overwrite
#
# 2) Run the active-learning loop to 10 cycles:
#      uv run promptillery train examples/paper/G2_banking77_modernbert_base.yaml
#
# 3) Read the deployment table off the summary (fidelity rides alongside
#    accuracy as heldout_teacher_fidelity):
#      uv run promptillery analyze out/g2 --metric accuracy
# =============================================================================

name: "g2_banking77_modernbert_base"

# Teacher: GPT-4.1 routed through OpenRouter.
teacher: "openrouter/openai/gpt-4.1"

student: "answerdotai/ModernBERT-base"
student_type: "transformers"

dataset: "PolyAI/banking77"
# PolyAI/banking77 ships a loader script; recent `datasets` refuses to run it
# without trust_remote_code, so a fresh `train`/`materialize-sft` fails to load
# the data unless we opt in here.
dataset_kwargs:
  trust_remote_code: true
dataset_config:
  name: "default"
  num_classes: 77
  text_field: "text"
  label_field: "label"

metrics:
  - accuracy
  - f1

# One monotonic run to 10 cycles; the sweep {1,5,10} is read from per-cycle
# metrics rather than re-run.
cycles: 10
seed: 13

learning_rate: 2e-5
num_train_epochs: 3
batch_size: 32
augmentation_batch_size: 32

# Banking77 ships only train+test, so carve a validation split from train for
# cycle selection: without it, cycle eval falls back to test and the AL loop is
# steered by (and reported on) the same split -- train/test leakage.
require_validation_split: true

# Active-learning-loop teacher output cap: must leave headroom for the
# augmentation_batch_size record generation, not just a single label.
# Materialization no longer reads this (that moved to
# examples/paper/G2_banking77_materialize.yaml, at 16 tokens), but the AL loop still
# needs it: with token_budget set, an UNSET cap makes the augmentation preflight
# mask every teacher call (engine.py:959-961), silently disabling augmentation.
teacher_max_output_tokens: 4096

token_budget: 20000000
budget_stop: true
base_output_dir: "out/g2"

early_stopping:
  enabled: false

trainer_config:
  # Cycle selection uses the carved validation split; report final
  # accuracy/fidelity on a clean held-out test pass.
  report_held_out_test: true

  # Student-vs-teacher fidelity on the held-out test split. Points at the
  # shared teacher test-label file materialized from the companion config
  # (step 1).
  fidelity:
    teacher_labels_path: "out/g2/banking77_teacher_test.jsonl"
    split: "test"

prompt: |
  You are a teacher model in a knowledge-distillation pipeline for the Banking77
  intent-classification task (77 fine-grained customer-banking intents).

  # Reference Examples
  {{ format_samples_for_prompt(few_shot_samples, include_prediction=False) }}

  # Student Model Performance
  ```
  {{ classification_report }}
  ```

  # Student Model Errors

  ## High Uncertainty Samples
  {{ format_samples_for_prompt(high_entropy_samples, include_prediction=True) }}

  ## Confident Misclassifications
  {{ format_samples_for_prompt(hard_negative_samples, include_prediction=True) }}

  # Task
  Generate {{ augmentation_batch_size }} new customer-message / intent-label
  samples that target the student's weakest and most-confused intents. Each
  sample must use a valid Banking77 intent as its gold label and cover diverse
  phrasings within each targeted intent.
