# =============================================================================
# M5 — tab:main-results, IMDB: same-N gold FT baseline, RoBERTa-base
# =============================================================================
# Issue #8 (part a). RoBERTa's promptillery rows are prior-submission reruns
# (percentage-based augmentation; no current-schema artifacts), so this cell's
# matched N REUSES the Ettin-encoder run's N for the same dataset (decision
# 2026-07-10). Same seed + same N => the prep top-up is byte-identical, so this
# config reads out/m5/imdb/ettin_encoder/train.jsonl directly — run the
# ettin_encoder prep first; there is NO roberta_base prep invocation:
#
#   uv run python scripts/prep_m5_same_n.py --dataset imdb --student ettin_encoder \
#     --run-dir out/g3/ablation_g3_imdb_ettin_encoder_*/g3_imdb_ettin_encoder_*_cycles-10_*
#
# Then:  uv run promptillery train examples/M5_imdb_same_n_roberta_base.yaml
# No `prompt:` key -> augmentation disabled -> ZERO teacher calls (GPU-only).
# Same recipe/seed as the encoder "fine-tuned (1 cycle)" protocol. NOT
# CI-verified; run on the remote GPU box. See examples/M5_README.md.
# =============================================================================

name: "m5_imdb_same_n_roberta_base"

teacher: "openrouter/openai/gpt-4.1"   # nominal: this run never calls the teacher

student: "FacebookAI/roberta-base"
student_type: "transformers"

dataset: "json"
dataset_kwargs:
  data_files:
    train: "out/m5/imdb/ettin_encoder/train.jsonl"
    validation: "out/m5/imdb/validation.jsonl"
    test: "out/m5/imdb/test.jsonl"
dataset_config:
  name: "default"
  num_classes: 2
  text_field: "text"
  label_field: "label"

metrics:
  - accuracy
  - f1

# Single fine-tune: same recipe/seed as the encoder "fine-tuned (1 cycle)" row.
cycles: 1
seed: 13

learning_rate: 2e-5
num_train_epochs: 3
batch_size: 32

require_validation_split: true
base_output_dir: "out/m5"

early_stopping:
  enabled: false

trainer_config:
  report_held_out_test: true
