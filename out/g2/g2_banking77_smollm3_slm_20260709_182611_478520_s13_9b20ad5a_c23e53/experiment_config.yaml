name: g2_banking77_smollm3_slm
teacher: openrouter/openai/gpt-4.1
student: HuggingFaceTB/SmolLM3-3B
teacher_revision: null
student_revision: null
tokenizer_revision: null
student_type: slm
dataset: json
dataset_revision: null
dataset_kwargs:
  data_files:
    train: out/g2/banking77_sft_train.jsonl
    validation: out/g2/banking77_sft_validation.jsonl
    test: out/g2/banking77_teacher_test.jsonl
dataset_config:
  name: default
  num_classes: 77
  text_field: student_prompt
  label_field: gold_answer
num_labels: null
metrics:
- eval_loss
- perplexity
- exact_match
- macro_f1
cycles: 10
seed: 13
early_stopping:
  enabled: false
  patience: 2
  metric: accuracy
  mode: max
  min_delta: 0.0
  restore_best: true
sampling:
  enabled: false
  sample_size: 1000
  train_ratio: 0.8
  stratify_column: label
  seed: 42
output_repo: null
base_output_dir: out/g2
prompt: 'You are a teacher model in a knowledge-distillation pipeline for the Banking77

  intent-classification task (77 fine-grained customer-banking intents).


  # Reference Examples

  {{ format_samples_for_prompt(few_shot_samples, include_prediction=False) }}


  # Student Model Performance

  ```

  {{ classification_report }}

  ```


  # Student Model Errors


  ## High Uncertainty Samples

  {{ format_samples_for_prompt(high_entropy_samples, include_prediction=True) }}


  ## Confident Misclassifications

  {{ format_samples_for_prompt(hard_negative_samples, include_prediction=True) }}


  # Task

  Generate {{ augmentation_batch_size }} new customer-message / intent-label SFT

  records that target the student''s weakest and most-confused intents. Each

  record must use a valid Banking77 intent as its gold answer and cover diverse

  phrasings within each targeted intent.

  '
prompt_vars: null
augmentation_batch_size: 32
teacher_max_output_tokens: 4096
policy_name: fixed_promptillery
policy_prompt_operators:
- coverage
- boundary
- repair
policy_teacher_tiers: {}
policy_batch_sizes:
- 16
- 32
- 64
policy_include_stop: true
policy_lambda_cost: 0.0001
policy_exploration_bonus: 0.0
policy_pacing_epsilon: 1.0e-06
budget_warning: null
token_budget: 20000000
synthetic_record_budget: null
budget_stop: true
control_name: null
price_table_path: null
learning_rate: 0.0001
batch_size: 8
num_train_epochs: 3
warmup_steps: 10
weight_decay: 0.0
trainer_config:
  max_seq_length: 512
  report_held_out_test: true
  use_lora: true
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lora_target_modules: all-linear
  prompt_field: student_prompt
  response_field: teacher_response
  gold_answer_field: gold_answer
  answer_extraction: canonical_label
  canonical_label_decoding: score
  canonical_labels_path: out/g2/canonical_labels.json
  task_metric: macro_f1
  completion_only_loss: true
  generation_max_new_tokens: 16
  generation_batch_size: 4
  max_eval_generation_samples: 500
  budget_splits:
  - train
  require_teacher_token_fields: true
  fidelity:
    teacher_labels_path: out/g2/banking77_teacher_test.jsonl
    split: test
persist_datasets: true
require_validation_split: true
paper_mode: false
auto_modify_name: true
