# Per-device on-demand serving rates (USD per device-hour), keyed on the
# profile's gpu_name hardware stamp, falling back to device. Consumed by
# pareto.serving_cost_per_call and pareto.training_cost_usd.
#
# PROVENANCE (fixed before the recommender was evaluated; see
# docs/TARGETS_DERIVATION.md). Sources snapshotted on 2026-09-22:
#   RTX 4090: RunPod on-demand list rates, community $0.34/h and secure
#             cloud $0.74/h (https://www.runpod.io/pricing); cross-provider
#             on-demand median $0.46/h across 17 providers
#             (https://getdeploying.com/gpus/nvidia-rtx-4090). $0.40 sits
#             between the community rate and the median, within 25 % of it.
#   cpu:      AWS c7i.large on-demand, us-east-1, 2 vCPU at $0.08925/h
#             => $0.045 per vCPU-hour, rounded to $0.05
#             (https://instances.vantage.sh/aws/ec2/c7i.large).
usd_per_hour:
  "NVIDIA GeForce RTX 4090": 0.40
  "cpu": 0.05
